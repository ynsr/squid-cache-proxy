# Strip only common cache-busting parameters
^(https?://[^?]+\.
    (js|css|woff2?|ttf|eot|otf|
     jpe?g|png|gif|webp|svg|ico|bmp|
     mp4|webm|mkv|avi|mov|wmv|flv|ts|
     m3u8|mpd)
   )\?[^#]*
   (?:(?:[&;](?:v|ver|version|timestamp|t|_=[0-9]+|nocache|rand|cb=))[^#]*)*$ \1

# YouTube specific: strip signature timestamps but keep format
^(https?://[^?]+\.(googlevideo|ytimg)\.com/[^?]+)\?.*(?:&|;)(?:expire|signature).*$ \1

# Twitter: keep media_id but strip cache busters
^(https?://[^?]+\.twimg\.com/media/[A-Za-z0-9_-]+)\?.*$ \1
